<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Versatile — Nueva Rutina</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="iphone-frame">
    <div class="status-bar">
      <span class="time">10:41</span>
      <span class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="24" height="12" viewBox="0 0 24 12" fill="currentColor"><rect x="0" y="1" width="20" height="10" rx="2" stroke="currentColor" stroke-width="1" fill="none"/><rect x="21" y="4" width="2" height="4" rx="1"/><rect x="2" y="3" width="14" height="6" rx="1" fill="currentColor"/></svg>
      </span>
    </div>

    <div class="screen-content" style="padding-bottom: 100px;">
      <!-- Header -->
      <div class="new-routine-header">
        <div class="session-detail-back" onclick="window.location.href='03-routines.html'" style="margin-bottom:16px;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15,18 9,12 15,6"/></svg>
        </div>
        <div class="new-routine-title">Nueva Rutina</div>
        <div class="new-routine-subtitle">Dale un nombre y elige un color</div>
      </div>

      <!-- Name Input -->
      <div style="padding: 0 20px; margin-bottom: 24px;">
        <input class="input" type="text" placeholder="e.g. Push Day, Full Body..." style="font-size:16px;">
      </div>

      <!-- Color Picker -->
      <div class="color-picker">
        <div class="color-picker-label">Color</div>
        <div class="color-options">
          <div class="color-option selected" style="background:var(--color-brasa);"></div>
          <div class="color-option" style="background:#D4728C;"></div>
          <div class="color-option" style="background:#E8A090;"></div>
          <div class="color-option" style="background:var(--color-camello);"></div>
          <div class="color-option" style="background:#A08060;"></div>
          <div class="color-option" style="background:var(--color-oliva);"></div>
          <div class="color-option" style="background:#8B5CF6;"></div>
          <div class="color-option" style="background:var(--color-pizarra);"></div>
        </div>
      </div>

      <!-- Icon Picker -->
      <div class="icon-picker">
        <div class="icon-picker-label">Icono</div>
        <div class="icon-options">
          <div class="icon-option selected">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 8v8M8 20l4-4 4 4"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8c0-2-1.5-4-4-4S10 6 10 8s1.5 4 4 4 4-2 4-4z"/><path d="M6 20c0-2 1.5-4 4-4s4 2 4 4"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          </div>
          <div class="icon-option">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Button -->
    <div style="position:absolute; bottom:20px; left:16px; right:16px;">
      <button class="btn btn-secondary btn-full" style="padding:16px; font-size:16px; border-radius:16px;">Crear rutina</button>
    </div>

    <div class="home-indicator"></div>
  </div>

  <script>
    // Color picker interaction
    document.querySelectorAll('.color-option').forEach(el => {
      el.addEventListener('click', function() {
        document.querySelectorAll('.color-option').forEach(e => e.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
    // Icon picker interaction
    document.querySelectorAll('.icon-option').forEach(el => {
      el.addEventListener('click', function() {
        document.querySelectorAll('.icon-option').forEach(e => e.classList.remove('selected'));
        this.classList.add('selected');
      });
    });
  </script>
</body>
</html>
