<!DOCTYPE html>
<html lang="es">
<head>

<body>
  <div class="iphone-frame">
    <div class="status-bar">
      <span class="time">10:41</span>
      <span class="icons">
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="7" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>

      </span>
    </div>

    <div class="screen-content" style="padding-bottom: 100px;">
      <div class="screen-header">
        <div>
          <div class="screen-title">Rutinas</div>
          <div class="screen-subtitle">2 rutinas en tu biblioteca</div>
        </div>
        <button class="btn-icon" style="background:var(--accent); border-color:var(--accent);" onclick="window.location.href='08-new-routine.html'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>

      <!-- UPPER Routine -->
      <div class="card routine-card">
        <div class="routine-icon upper">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent-secondary)" stroke-width="2"><path d="M2 12h4l3-9 4 18 3-9h4"/></svg>
        </div>
        <div class="routine-info">
          <div class="routine-name">UPPER</div>
          <div class="routine-meta">8 ejercicios · ~62 min</div>
          <div class="routine-tags">
            <span class="routine-tag upper">Pecho</span>
            <span class="routine-tag upper">Tríceps</span>
            <span class="routine-tag upper">Hombros</span>
            <span class="routine-tag upper">Espalda</span>
            <span class="routine-tag upper">Bíceps</span>
          </div>
        </div>
      </div>

      <!-- LOWER Routine -->
      <div class="card routine-card">
        <div class="routine-icon lower">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="5" r="3"/><path d="M12 8v8M8 20l4-4 4 4"/></svg>
        </div>
        <div class="routine-info">
          <div class="routine-name">LOWER</div>
          <div class="routine-meta">6 ejercicios · ~54 min</div>
          <div class="routine-tags">
            <span class="routine-tag lower">Cuádriceps</span>
            <span class="routine-tag lower">Isquiotibiales</span>
            <span class="routine-tag lower">Otros</span>
            <span class="routine-tag lower">Gemelos</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="02-home.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Inicio</span>

      <a href="03-routines.html" class="bottom-nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        <span>Rutinas</span>

      <a href="04-exercises.html" class="bottom-nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5L17.5 17.5M17.5 6.5L6.5 17.5M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
        <span>Ejercicios</span>
      </a>
      <a href="05-history.html" class="bottom-nav-item">
