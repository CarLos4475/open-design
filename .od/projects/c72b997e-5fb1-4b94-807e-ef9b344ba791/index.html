<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio — Win95 Retro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --desktop: #008080;
      --gray: #c0c0c0;
      --gray-dark: #808080;
      --black: #000;
      --white: #fff;
      --title: #000080;
      --font: 'Tahoma', 'MS Sans Serif', Geneva, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--desktop);
      font-family: var(--font);
      font-size: 12px;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: unset;
      image-rendering: pixelated;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .frame {
      width: 420px;
      background: var(--gray);
      border: 4px solid;
      border-color: var(--white) var(--black) var(--black) var(--white);
      box-shadow: 4px 4px 0 rgba(0,0,0,0.4);
    }
    .frame-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      background: linear-gradient(90deg, var(--title), #1084d0);
      color: var(--white);
      font-weight: 700;
      font-size: 12px;
    }
    .frame-btns { display: flex; gap: 2px; }
    .frame-btns span {
      display: inline-block;
      width: 16px; height: 16px;
      background: var(--gray);
      border: 2px solid;
      border-color: var(--white) var(--black) var(--black) var(--white);
      text-align: center;
      line-height: 14px;
      font-size: 10px;
      color: var(--black);
    }
    .frame-body {
      position: relative;
      width: 100%;
      padding-bottom: 195%;
      background: var(--white);
      border: 2px solid;
      border-color: var(--gray-dark) var(--white) var(--white) var(--gray-dark);
    }
    .frame-body iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .title-section {
      text-align: center;
      margin-bottom: 28px;
    }
    .title-section h1 {
      font-family: 'Tahoma', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--white);
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      margin-bottom: 4px;
    }
    .title-section p {
      font-size: 12px;
      color: rgba(255,255,255,0.8);
    }

    .toolbar {
      margin-top: 20px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .toolbar a {
      padding: 6px 16px;
      background: var(--gray);
      border: 2px solid;
      border-color: var(--white) var(--black) var(--black) var(--white);
      color: var(--black);
      font-family: var(--font);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .toolbar a:active {
      border-color: var(--black) var(--white) var(--white) var(--black);
    }
    .toolbar a:hover { background: #dfdfdf; }

    .footer {
      margin-top: 24px;
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-align: center;
    }

    @media (max-width: 500px) {
      .frame { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="title-section">
      <h1>🪟 Portfolio — Win95</h1>
      <p>Carlos Emi · Designer &amp; Developer</p>
    </div>

    <div class="frame">
      <div class="frame-title">
        <span>📁 screens/app.html</span>
        <div class="frame-btns">
          <span>_</span><span>□</span><span>✕</span>
        </div>
      </div>
      <div class="frame-body">
        <iframe src="screens/app.html" title="Portfolio preview"></iframe>
      </div>
    </div>

    <div class="toolbar">
      <a href="screens/app.html" target="_blank">Open full screen ↗</a>
    </div>

    <div class="footer">
      Built with the Retro Windows 95 plugin · 2025
    </div>
  </div>
</body>
</html>
